[project]
name = "tocket"
version = "4.4.0.2"
description = "Tocket - CLI GitHub manager"
authors = [
  { name = "neveerlabs", email = "userlinuxorg@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.13"

[project.scripts]
tocket = "tocket.__main__:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
